<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LinkVault | Premium Access</title>
  <link rel="preconnect" href="https://www.highperformanceformat.com">
  <link rel="preconnect" href="https://pl30678418.effectivecpmnetwork.com">
  <link rel="preconnect" href="https://pl30678420.effectivecpmnetwork.com">
  <link rel="preconnect" href="https://pl30604520.effectivecpmnetwork.com">
  <link rel="dns-prefetch" href="https://www.highperformanceformat.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06060b;
      --surface: rgba(255,255,255,0.045);
      --border: rgba(255,255,255,0.08);
      --accent: #8b5cf6;
      --accent2: #06b6d4;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      top: -45%; left: -25%;
      width: 85%; height: 85%;
      background: radial-gradient(circle, rgba(139,92,246,0.14) 0%, transparent 68%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -35%; right: -25%;
      width: 75%; height: 75%;
      background: radial-gradient(circle, rgba(6,182,212,0.11) 0%, transparent 68%);
      pointer-events: none; z-index: 0;
    }

    #top-progress {
      position: fixed; top: 0; left: 0;
      height: 3.5px; width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #06b6d4, #22d3ee);
      z-index: 9999;
      transition: width 0.08s linear;
      box-shadow: 0 0 24px rgba(139,92,246,0.55);
    }

    /* ===== ADMIN ===== */
    #admin-page {
      display: none; position: relative; z-index: 1;
      max-width: 480px; margin: 0 auto; padding: 56px 20px 80px;
    }
    #admin-page.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.55);
      animation: fadeUp 0.5s ease;
    }

    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 {
      font-size: 2rem; font-weight: 800; letter-spacing: -0.6px;
      background: linear-gradient(135deg, #a78bfa, #22d3ee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .logo p { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }

    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 0.8rem; font-weight: 500;
      color: var(--muted); margin-bottom: 8px; letter-spacing: 0.3px;
    }
    .field input {
      width: 100%; padding: 15px 16px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 14px; color: var(--text);
      font-size: 0.95rem; font-family: inherit; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.18);
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px 20px; border: none; border-radius: 14px;
      font-family: inherit; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 55%, #5b21b6 100%);
      color: #fff;
      box-shadow: 0 8px 28px rgba(124,58,237,0.4);
      letter-spacing: 0.2px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(124,58,237,0.5);
      filter: brightness(1.06);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-ghost {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 10px;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }

    .btn-scroll, .btn-next { max-width: 300px; margin: 0 auto; display: none; }
    .btn-scroll.show, .btn-next.show { display: inline-flex; }

    .result {
      display: none; margin-top: 24px; padding: 18px;
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 16px;
    }
    .result.show { display: block; }
    .result .url {
      word-break: break-all; font-size: 0.85rem;
      color: var(--success); margin-bottom: 14px; font-weight: 500;
    }

    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px;
    }
    .stat {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px; text-align: center;
    }
    .stat .num {
      font-size: 1.6rem; font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #22d3ee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .stat .lbl {
      font-size: 0.72rem; color: var(--muted); margin-top: 4px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* ===== FLOW ===== */
    #flow-page {
      display: none; position: relative; z-index: 1; padding-bottom: 90px;
    }
    #flow-page.active { display: block; }

    .stage {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 28px 16px 50px;
    }

    .page-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, rgba(139,92,246,0.16), rgba(6,182,212,0.1));
      border: 1px solid rgba(139,92,246,0.32);
      padding: 8px 18px; border-radius: 100px;
      font-size: 0.82rem; font-weight: 600; color: #c4b5fd;
      margin-bottom: 24px; letter-spacing: 0.3px;
      animation: floatBadge 3s ease-in-out infinite;
    }

    .ad-label {
      font-size: 0.62rem; letter-spacing: 1.6px; color: var(--muted);
      text-transform: uppercase; margin-bottom: 6px; text-align: center; font-weight: 500;
    }

    .ad-box {
      position: relative;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      animation: fadeUp 0.45s ease;
    }

    #ad-top-300, #ad-bot-300 {
      width: 300px; height: 250px; min-width: 300px; min-height: 250px;
    }
    #ad-top-728, #ad-bot-728 {
      width: 728px; max-width: 100%; height: 90px; min-height: 90px;
    }

    .ad-wrap-728 {
      width: 100%; display: flex; justify-content: center;
      overflow-x: auto; margin-bottom: 6px;
    }

    @media (max-width: 760px) {
      #ad-top-728, #ad-bot-728 { transform: scale(0.9); transform-origin: top center; }
    }
    @media (max-width: 680px) {
      #ad-top-728, #ad-bot-728 { transform: scale(0.75); }
    }
    @media (max-width: 560px) {
      #ad-top-728, #ad-bot-728 { transform: scale(0.6); }
    }
    @media (max-width: 420px) {
      #ad-top-728, #ad-bot-728 { transform: scale(0.5); }
    }

    .center-info {
      text-align: center; margin: 16px 0 8px; max-width: 360px;
      animation: fadeUp 0.4s ease 0.1s both;
    }

    .status {
      font-size: 0.92rem; color: var(--muted); margin-bottom: 12px;
      min-height: 24px; font-weight: 500; letter-spacing: 0.2px;
    }

    .click-msg {
      display: none; font-size: 0.86rem; color: #a78bfa;
      font-weight: 600; margin-bottom: 12px; text-align: center;
    }
    .click-msg.show { display: block; animation: fadeUp 0.3s ease; }

    .stage-progress-wrap {
      width: 100%; max-width: 300px; height: 8px;
      background: rgba(255,255,255,0.07);
      border-radius: 100px; overflow: hidden;
      margin: 0 auto 20px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    }
    .stage-progress {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #06b6d4, #22d3ee);
      background-size: 200% 100%;
      border-radius: 100px;
      transition: width 0.1s linear;
      box-shadow: 0 0 12px rgba(139,92,246,0.4);
      animation: progressShine 2.5s linear infinite;
    }

    #native-wrap {
      display: none; width: 100%; max-width: 360px;
      margin: 24px auto 8px; min-height: 80px; max-height: 300px; overflow: hidden;
    }
    #native-wrap.show { display: block; animation: fadeUp 0.4s ease; }

    #final-box {
      display: none; text-align: center; margin-top: 22px; padding: 32px 24px;
      background: linear-gradient(145deg, rgba(139,92,246,0.1), rgba(6,182,212,0.06));
      border: 1px solid rgba(139,92,246,0.22);
      border-radius: 22px; max-width: 360px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }
    #final-box.show { display: block; animation: fadeUp 0.5s ease; }

    .click-overlay {
      position: absolute; inset: 0; z-index: 20;
      cursor: pointer; background: transparent;
    }
    .click-overlay.hidden { display: none; }

    .shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      pointer-events: none; border-radius: 14px;
    }
    .ad-box.loaded .shimmer { display: none; }

    #social-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 9000; pointer-events: auto;
    }

    .error-box {
      max-width: 400px; margin: 100px auto; text-align: center;
      padding: 40px 24px; position: relative; z-index: 1;
    }
    .error-box h2 { color: #f87171; margin-bottom: 12px; }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 8px 28px rgba(124,58,237,0.4); }
      50% { box-shadow: 0 8px 40px rgba(124,58,237,0.7), 0 0 22px rgba(6,182,212,0.3); }
    }
    @keyframes progressShine {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .btn-scroll.show, .btn-next.show {
      animation: fadeUp 0.45s ease, pulseGlow 2.2s ease-in-out infinite;
    }
    .btn-scroll.show, .btn-next.show, #final-box.show .btn-primary {
      position: relative; overflow: hidden;
    }
    .btn-scroll.show::after, .btn-next.show::after {
      content: '';
      position: absolute; top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.14) 50%, transparent 60%);
      animation: progressShine 2s linear infinite;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="top-progress"></div>

  <!-- ADMIN -->
  <div id="admin-page">
    <div class="card">
      <div class="logo">
        <h1>LinkVault</h1>
        <p>Premium short links with smart access</p>
      </div>
      <div class="field">
        <label>Destination Link</label>
        <input type="url" id="main-link" placeholder="https://example.com/your-page" autocomplete="off">
      </div>
      <button class="btn btn-primary" onclick="createShortLink()">Create Short Link</button>
      <div class="result" id="result-box">
        <div class="url" id="short-url-text"></div>
        <button class="btn btn-ghost" onclick="copyShortLink()">Copy Link</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="num" id="stat-links">0</div>
        <div class="lbl">Links Created</div>
      </div>
      <div class="stat">
        <div class="num" id="stat-visits">0</div>
        <div class="lbl">Total Visits</div>
      </div>
    </div>
  </div>

  <!-- FLOW -->
  <div id="flow-page">
    <div class="stage" id="stage-top">
      <div class="page-badge">Page <span id="page-num">1</span> / 3</div>

      <div class="ad-label">ADVERTISEMENT</div>
      <div class="ad-box" id="ad-top-300"><div class="shimmer"></div></div>

      <div class="ad-label">ADVERTISEMENT</div>
      <div class="ad-wrap-728">
        <div class="ad-box" id="ad-top-728"><div class="shimmer"></div></div>
      </div>

      <div class="center-info">
        <div class="status" id="status-top">Please wait a moment...</div>
        <div class="click-msg" id="click-msg-top"></div>
        <div class="stage-progress-wrap">
          <div class="stage-progress" id="progress-top"></div>
        </div>
        <button class="btn btn-primary btn-scroll" id="btn-scroll" onclick="doScrollDown()">
          Click to scroll down ↓
        </button>
      </div>

      <div id="native-wrap"></div>
    </div>

    <div class="stage" id="stage-bottom">
      <div class="ad-label">ADVERTISEMENT</div>
      <div class="ad-box" id="ad-bot-300"><div class="shimmer"></div></div>

      <div class="ad-label">ADVERTISEMENT</div>
      <div class="ad-wrap-728">
        <div class="ad-box" id="ad-bot-728"><div class="shimmer"></div></div>
      </div>

      <div class="center-info">
        <div class="status" id="status-bot">Please wait a moment...</div>
        <div class="click-msg" id="click-msg-bot"></div>
        <div class="stage-progress-wrap">
          <div class="stage-progress" id="progress-bot"></div>
        </div>
        <button class="btn btn-primary btn-next" id="btn-next" onclick="goNext()">Next Page →</button>

        <div id="final-box">
          <p style="font-size:0.9rem;color:var(--muted);margin-bottom:16px;">Access ready</p>
          <button class="btn btn-primary" onclick="handleGetAccess()" style="margin-bottom:10px;">Get Access</button>
          <button class="btn btn-ghost" id="btn-continue" style="display:none;" onclick="goToMain()">Continue to Destination →</button>
        </div>
      </div>
    </div>
  </div>

  <div id="social-bar"></div>

  <script>
    const AD_300_KEY = 'fe5425c87d33c6441e36242e1aa8281b';
    const AD_728_KEY = '4c342efed49c6f38506bdcbbb7ecee4a';
    const SMARTLINKS = [
      'https://www.effectivecpmnetwork.com/xqug1e3v96?key=b75732661b59d7a6f37cf1d0de725805',
      'https://www.effectivecpmnetwork.com/gpstdryr?key=2fd55fe93f90bdbe82e3452805296412',
      'https://www.effectivecpmnetwork.com/t3dzv8fv?key=0f835b1c02f51864c0814e9a10e8dbdb',
      'https://www.effectivecpmnetwork.com/v390gi5k?key=a634a3f6a0067c14cb621dc5e47b5aec',
      'https://www.effectivecpmnetwork.com/v3ktmve58i?key=e2dbaadb1f40e27b9fa3b0db449f92f1'
    ];
    const POPUNDER_SRC = 'https://pl30678418.effectivecpmnetwork.com/48/83/fb/4883fb52f7127667e94cd6a91d5396b9.js';
    const NATIVE_SRC = 'https://pl30678420.effectivecpmnetwork.com/556e27d323d8a3c52412ad771d77b37d/invoke.js';
    const NATIVE_ID = 'container-556e27d323d8a3c52412ad771d77b37d';
    const SOCIAL_SRC = 'https://pl30604520.effectivecpmnetwork.com/c6/98/6f/c6986f1308525aeb043ac559070a08c6.js';

    const STAGE_TIME = 7; // slightly longer = better session (safe)
    const TOTAL_PAGES = 3;

    let mainLink = '';
    let currentPage = 1;
    let currentStage = 'top';
    let timer = null;
    let remain = 0;
    let assignedSmartlink = '';
    let smartlinkOpened = false;
    let clickStages = [];
    let clicksNeeded = 0;
    let clicksDone = 0;
    let stagePaused = false;

    // ===== AD LOADER (most reliable method) =====
    function loadAd(key, width, height, containerId) {
      const box = document.getElementById(containerId);
      if (!box) return;

      while (box.firstChild) box.removeChild(box.firstChild);
      box.classList.remove('loaded');
      box.style.width = width + 'px';
      box.style.height = height + 'px';
      box.style.maxWidth = '100%';
      box.style.marginLeft = 'auto';
      box.style.marginRight = 'auto';

      const shimmer = document.createElement('div');
      shimmer.className = 'shimmer';
      box.appendChild(shimmer);

      // Official exact format
      const conf = document.createElement('script');
      conf.type = 'text/javascript';
      conf.text = "atOptions = {\n  'key' : '" + key + "',\n  'format' : 'iframe',\n  'height' : " + height + ",\n  'width' : " + width + ",\n  'params' : {}\n};";
      box.appendChild(conf);

      setTimeout(function () {
        const inv = document.createElement('script');
        inv.type = 'text/javascript';
        inv.src = 'https://www.highperformanceformat.com/' + key + '/invoke.js';
        inv.onload = function () {
          box.classList.add('loaded');
          setTimeout(function () { addOverlay(containerId); }, 250);
        };
        inv.onerror = function () {
          box.classList.add('loaded');
          addOverlay(containerId);
        };
        box.appendChild(inv);
      }, 80);
    }

    function loadTopAds() {
      loadAd(AD_300_KEY, 300, 250, 'ad-top-300');
      setTimeout(function () { loadAd(AD_728_KEY, 728, 90, 'ad-top-728'); }, 700);
    }

    function loadBottomAds() {
      loadAd(AD_300_KEY, 300, 250, 'ad-bot-300');
      setTimeout(function () { loadAd(AD_728_KEY, 728, 90, 'ad-bot-728'); }, 700);
    }

    // ===== OVERLAY CLICK =====
    function addOverlay(containerId) {
      const box = document.getElementById(containerId);
      if (!box) return;
      const old = box.querySelector('.click-overlay');
      if (old) old.remove();
      const ov = document.createElement('div');
      ov.className = 'click-overlay' + (stagePaused ? '' : ' hidden');
      ov.onclick = handleAdClick;
      box.appendChild(ov);
    }

    function handleAdClick(e) {
      e.preventDefault();
      e.stopPropagation();
      if (!stagePaused || clicksNeeded <= 0) return;

      clicksDone++;
      updateClickMsg();

      const ov = e.currentTarget;
      ov.classList.add('hidden');
      setTimeout(function () {
        if (clicksDone < clicksNeeded) ov.classList.remove('hidden');
      }, 500);

      if (clicksDone >= clicksNeeded) {
        stagePaused = false;
        hideAllOverlays();
        document.getElementById('click-msg-top').classList.remove('show');
        document.getElementById('click-msg-bot').classList.remove('show');
        resumeStageTimer();
      }
    }

    function hideAllOverlays() {
      document.querySelectorAll('.click-overlay').forEach(function (o) { o.classList.add('hidden'); });
    }
    function showOverlays() {
      document.querySelectorAll('.click-overlay').forEach(function (o) { o.classList.remove('hidden'); });
    }
    function updateClickMsg() {
      const msg = 'Continue karva mate ad par click karo (' + clicksDone + '/' + clicksNeeded + ')';
      const el = currentStage === 'top' ? document.getElementById('click-msg-top') : document.getElementById('click-msg-bot');
      el.textContent = msg;
      el.classList.add('show');
    }

    // ===== POPUNDER / NATIVE / SOCIAL =====
    function loadPopunder() {
      const params = new URLSearchParams(window.location.search);
      const linkId = params.get('s') || 'default';
      const KEY = 'lv_pop_' + linkId.substring(0, 40);
      const now = Date.now();
      const last = parseInt(localStorage.getItem(KEY) || '0', 10);
      if (now - last < 24 * 60 * 60 * 1000) return;

      const s = document.createElement('script');
      s.src = POPUNDER_SRC;
      s.async = true;
      document.body.appendChild(s);
      localStorage.setItem(KEY, String(now));
    }

    function loadNative() {
      const wrap = document.getElementById('native-wrap');
      wrap.innerHTML = '';
      wrap.classList.add('show');
      const div = document.createElement('div');
      div.id = NATIVE_ID;
      wrap.appendChild(div);
      const s = document.createElement('script');
      s.async = true;
      s.setAttribute('data-cfasync', 'false');
      s.src = NATIVE_SRC;
      wrap.appendChild(s);
    }

    function loadSocialBar() {
      const bar = document.getElementById('social-bar');
      if (!bar) return;
      bar.innerHTML = '';
      const s = document.createElement('script');
      s.src = SOCIAL_SRC;
      s.async = true;
      bar.appendChild(s);
    }

    // ===== TIMER =====
    function setTopProgress(pct) {
      document.getElementById('top-progress').style.width = Math.min(100, pct) + '%';
    }
    function setStageProgress(elId, pct) {
      document.getElementById(elId).style.width = Math.min(100, pct) + '%';
    }

    function startStageTimer(stage) {
      if (timer) clearInterval(timer);
      remain = STAGE_TIME;
      currentStage = stage;
      const progId = stage === 'top' ? 'progress-top' : 'progress-bot';
      const statusId = stage === 'top' ? 'status-top' : 'status-bot';
      const btnId = stage === 'top' ? 'btn-scroll' : 'btn-next';
      const msgId = stage === 'top' ? 'click-msg-top' : 'click-msg-bot';

      document.getElementById(btnId).classList.remove('show');
      document.getElementById(msgId).classList.remove('show');
      document.getElementById(statusId).textContent = 'Please wait a moment...';
      setStageProgress(progId, 0);

      const stageKey = currentPage + '-' + stage;
      clicksNeeded = clickStages.filter(function (s) { return s === stageKey; }).length;
      clicksDone = 0;
      stagePaused = clicksNeeded > 0;

      if (stagePaused) {
        document.getElementById(statusId).textContent = 'Please interact with the ads';
        updateClickMsg();
        setTimeout(showOverlays, 900);
      } else {
        hideAllOverlays();
      }

      runTimer(stage, progId, statusId, btnId);
    }

    function runTimer(stage, progId, statusId, btnId) {
      const start = Date.now();
      const initialRemain = remain;
      timer = setInterval(function () {
        if (stagePaused) return;
        const elapsed = (Date.now() - start) / 1000;
        remain = Math.max(0, initialRemain - elapsed);
        const pct = ((STAGE_TIME - remain) / STAGE_TIME) * 100;
        setStageProgress(progId, pct);

        const stageIndex = (currentPage - 1) * 2 + (stage === 'top' ? 0 : 1);
        const overall = ((stageIndex + (STAGE_TIME - remain) / STAGE_TIME) / 6) * 100;
        setTopProgress(overall);

        if (remain <= 0) {
          clearInterval(timer);
          timer = null;
          document.getElementById(statusId).textContent = stage === 'top' ? 'Ready to continue' : 'Ready for next step';
          document.getElementById(btnId).classList.add('show');
          if (stage === 'bottom' && currentPage === TOTAL_PAGES) {
            document.getElementById('btn-next').classList.remove('show');
            document.getElementById('final-box').classList.add('show');
            document.getElementById('status-bot').textContent = 'All steps completed';
            setTopProgress(100);
          }
        }
      }, 50);
    }

    function resumeStageTimer() {
      const stage = currentStage;
      const progId = stage === 'top' ? 'progress-top' : 'progress-bot';
      const statusId = stage === 'top' ? 'status-top' : 'status-bot';
      const btnId = stage === 'top' ? 'btn-scroll' : 'btn-next';
      document.getElementById(statusId).textContent = 'Thanks! Continuing...';
      runTimer(stage, progId, statusId, btnId);
    }

    // ===== NAV =====
    function doScrollDown() {
      document.getElementById('btn-scroll').classList.remove('show');
      currentStage = 'bottom';
      loadBottomAds();

      const top = document.getElementById('stage-top');
      const bottom = document.getElementById('stage-bottom');

      // Collapse top stage
      top.style.transition = 'opacity 0.25s ease, max-height 0.3s ease';
      top.style.opacity = '0';
      top.style.maxHeight = '0';
      top.style.overflow = 'hidden';
      top.style.padding = '0';
      top.style.minHeight = '0';
      top.style.margin = '0';
      top.style.border = 'none';

      // Bottom: compact, no huge empty space
      bottom.style.minHeight = 'auto';
      bottom.style.paddingTop = '12px';
      bottom.style.paddingBottom = '40px';

      // Wait for layout collapse, then scroll so 300x250 is fully visible at top
      setTimeout(function () {
        // Target the first bottom ad so it sits fully in view
        const ad = document.getElementById('ad-bot-300');
        if (ad) {
          const rect = ad.getBoundingClientRect();
          const absoluteTop = rect.top + window.pageYOffset;
          // small gap from top of screen (safe area)
          const offset = 12;
          window.scrollTo({ top: Math.max(0, absoluteTop - offset), behavior: 'smooth' });
        } else {
          const y = bottom.getBoundingClientRect().top + window.pageYOffset - 12;
          window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
        }
      }, 350);

      setTimeout(function () { startStageTimer('bottom'); }, 700);
    }

    function goNext() {
      if (currentPage >= TOTAL_PAGES) return;
      currentPage++;
      currentStage = 'top';
      document.getElementById('page-num').textContent = currentPage;
      document.getElementById('btn-next').classList.remove('show');
      document.getElementById('final-box').classList.remove('show');
      setStageProgress('progress-bot', 0);
      document.getElementById('status-bot').textContent = 'Please wait a moment...';

      const top = document.getElementById('stage-top');
      const bottom = document.getElementById('stage-bottom');
      top.style.transition = 'none';
      top.style.opacity = '1';
      top.style.maxHeight = '';
      top.style.overflow = '';
      top.style.padding = '';
      top.style.minHeight = '100vh';
      top.style.margin = '';
      bottom.style.minHeight = '100vh';
      bottom.style.paddingTop = '';

      window.scrollTo({ top: 0, behavior: 'smooth' });

      setTimeout(function () {
        loadTopAds();
        loadNative();
        loadSocialBar();
        startStageTimer('top');
      }, 400);
    }

    // ===== SMARTLINK + CLICK GROUP =====
    function assignSmartlink() {
      if (sessionStorage.getItem('sl_assigned')) {
        assignedSmartlink = sessionStorage.getItem('sl_url');
        smartlinkOpened = sessionStorage.getItem('sl_opened') === '1';
        return;
      }
      const idx = Math.floor(Math.random() * SMARTLINKS.length);
      assignedSmartlink = SMARTLINKS[idx];
      sessionStorage.setItem('sl_assigned', '1');
      sessionStorage.setItem('sl_url', assignedSmartlink);
      sessionStorage.setItem('sl_opened', '0');
    }

    function assignClickGroup() {
      if (sessionStorage.getItem('ck_assigned')) {
        clickStages = JSON.parse(sessionStorage.getItem('ck_stages') || '[]');
        return;
      }
      const r = Math.random();
      let stages = [];
      const all = ['1-top','1-bottom','2-top','2-bottom','3-top','3-bottom'];
      if (r < 0.06) {
        const pool = all.slice();
        stages.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
        stages.push(pool[Math.floor(Math.random() * pool.length)]);
      } else if (r < 0.10) {
        stages.push(all[Math.floor(Math.random() * all.length)]);
      }
      sessionStorage.setItem('ck_assigned', '1');
      sessionStorage.setItem('ck_stages', JSON.stringify(stages));
      clickStages = stages;
    }

    function handleGetAccess() {
      if (!smartlinkOpened) {
        smartlinkOpened = true;
        sessionStorage.setItem('sl_opened', '1');
        window.open(assignedSmartlink, '_blank');
        document.getElementById('btn-continue').style.display = 'inline-flex';
      } else {
        goToMain();
      }
    }

    function goToMain() {
      if (mainLink) window.location.href = mainLink;
    }

    // ===== ADMIN =====
    function createShortLink() {
      const url = (document.getElementById('main-link').value || '').trim();
      if (!url) { alert('Please enter a link'); return; }
      try { new URL(url); } catch (e) { alert('Enter a valid URL'); return; }
      const encoded = btoa(unescape(encodeURIComponent(url)));
      const short = window.location.origin + window.location.pathname + '?s=' + encoded;
      document.getElementById('short-url-text').textContent = short;
      document.getElementById('result-box').classList.add('show');
      const total = parseInt(localStorage.getItem('lv_links') || '0') + 1;
      localStorage.setItem('lv_links', total);
      document.getElementById('stat-links').textContent = total;
      window._last = short;
    }

    function copyShortLink() {
      const t = window._last || document.getElementById('short-url-text').textContent;
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { alert('Copied!'); });
      else {
        const ta = document.createElement('textarea');
        ta.value = t; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); alert('Copied!');
      }
    }

    // ===== INIT =====
    function init() {
      const params = new URLSearchParams(location.search);
      const s = params.get('s');
      if (!s) {
        document.getElementById('admin-page').classList.add('active');
        document.getElementById('stat-links').textContent = localStorage.getItem('lv_links') || '0';
        document.getElementById('stat-visits').textContent = localStorage.getItem('lv_visits') || '0';
        return;
      }
      try {
        mainLink = decodeURIComponent(escape(atob(s)));
        if (!mainLink.startsWith('http')) throw 0;
      } catch (e) {
        document.body.innerHTML = '<div class="error-box card"><h2>Invalid Link</h2><p style="color:var(--muted)">This link is broken.</p></div>';
        return;
      }
      const v = parseInt(localStorage.getItem('lv_visits') || '0') + 1;
      localStorage.setItem('lv_visits', v);

      document.getElementById('flow-page').classList.add('active');
      assignSmartlink();
      assignClickGroup();
      loadPopunder();
      loadTopAds();
      loadNative();
      loadSocialBar();
      startStageTimer('top');
    }

    init();
  </script>
</body>
</html>
